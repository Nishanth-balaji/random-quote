<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .quote-box {
            width: min(92vw, 680px);
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            border-radius: 14px;
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
            padding: 24px;
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 2rem;
        }

        #quote {
            margin: 0;
            font-size: 1.2rem;
            line-height: 1.6;
        }

        #author {
            margin: 14px 0 0;
            color: #cbd5e1;
            font-style: italic;
        }

        button {
            margin-top: 20px;
            padding: 11px 18px;
            border: none;
            border-radius: 8px;
            background: #f59e0b;
            color: #111827;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.15s ease;
        }

        button:hover {
            background-color: #fbbf24;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="quote-box" aria-live="polite">
        <h1>Random Quote Generator</h1>
        <p id="quote">Click the button to generate a quote!</p>
        <p id="author"></p>
        <button id="new-quote-btn" type="button">New Quote</button>
    </div>

    <script>
        const quotes = [
            {
                text: "The only limit to our realization of tomorrow is our doubts of today.",
                author: "Franklin D. Roosevelt"
            },
            {
                text: "Do what you can, with what you have, where you are.",
                author: "Theodore Roosevelt"
            },
            {
                text: "The best way to predict the future is to create it.",
                author: "Peter Drucker"
            },
            {
                text: "Success is not final, failure is not fatal: it is the courage to continue that counts.",
                author: "Winston Churchill"
            },
            {
                text: "Act as if what you do makes a difference. It does.",
                author: "William James"
            }
        ];

        const quoteElement = document.getElementById("quote");
        const authorElement = document.getElementById("author");
        const button = document.getElementById("new-quote-btn");

        let previousIndex = -1;

        function generateQuote() {
            let randomIndex;

            if (quotes.length === 1) {
                randomIndex = 0;
            } else {
                do {
                    randomIndex = Math.floor(Math.random() * quotes.length);
                } while (randomIndex === previousIndex);
            }

            previousIndex = randomIndex;
            const selected = quotes[randomIndex];
            quoteElement.textContent = `"${selected.text}"`;
            authorElement.textContent = `- ${selected.author}`;
        }

        button.addEventListener("click", generateQuote);
        generateQuote();
    </script>
</body>
</html>
